# ============================================================================
#  Production override  (ticket P1-T02 — STUB)
# ============================================================================
#  Layer this ON TOP of the base file for a production-shaped run:
#      docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
#  It switches Odoo to the multi-tenant config (config/odoo.prod.conf:
#  db_filter=^%d$, list_db=False, proxy_mode, workers=4) via `-c`, and removes
#  the host-exposed DB port. Both configs stay mounted; `-c` selects prod, so
#  there is no mount-target conflict with the base's dev config.
#
#  Nginx + TLS is wired below (P1-T03). Still outstanding for a full prod
#  deploy: a baked addon image instead of a bind mount, a real admin_passwd
#  secret, and off-host backups (P2). Those are their own tickets.
# ============================================================================
services:

  db:
    # Do NOT expose Postgres to the host in production.
    ports: !reset []

  odoo:
    # Select the multi-tenant production config (mounted below). The image
    # entrypoint still appends db_host/user/password from the HOST/USER/PASSWORD
    # env vars, so DB secrets continue to come from .env.
    command: odoo -c /etc/odoo/odoo.prod.conf
    volumes:
      - ./config/odoo.prod.conf:/etc/odoo/odoo.prod.conf:ro

  # Edge reverse proxy + TLS (P1-T03). Prod = *.ncollectionerp.com over HTTPS;
  # the prod server block routes the realtime bus to Odoo :8072 (prod runs
  # workers=4/gevent). Needs the wildcard cert issued BEFORE first start
  # (nginx won't boot without it) — see nginx/README.md.
  nginx:
    image: nginx:1.27-alpine
    container_name: ncollection-nginx
    depends_on:
      odoo:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d/ncollection.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    restart: unless-stopped

  # Let's Encrypt wildcard cert issuance + renewal. Wildcards require DNS-01,
  # so real issuance needs your DNS provider's plugin + API token — swap this
  # image to certbot/dns-<provider> and mount the creds for unattended renewal.
  # Full steps (incl. a manual fallback): nginx/README.md.
  certbot:
    image: certbot/certbot:latest
    container_name: ncollection-certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # Twice-daily renewal loop (a no-op until a cert exists; DNS-01 renewal
    # additionally needs the provider plugin + creds — see README).
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done'
    restart: unless-stopped

volumes:
  certbot_certs:
  certbot_www:
