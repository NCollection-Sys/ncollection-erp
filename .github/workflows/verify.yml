name: NCollection ERP Verify

# Cross-suite verification (INFRA-02). Supersedes the old e2e-only workflow.
#
# A ticket that proves only its OWN lane cannot see a cross-suite regression —
# which is exactly how breakage between routing and e2e stayed invisible. This
# job brings up ONE stack and runs every guarantee against it.
#
# Suites run with continue-on-error so a single failure does not mask the rest:
# you get the COMPLETE picture per run, and a final gate step fails the job.
#
# NOTE — the P2-T01 provisioning proof is deliberately NOT here. It documents
# itself as "local; heavy — not a CI test", and needs a platform DB with
# ncollection_saas installed. `make verify-all` runs it locally; overriding that
# decision here would blow the time budget for little marginal signal.
#
# Reusable: `workflow_call` lets canary.yml (post-merge) and nightly.yml reuse
# this exact suite instead of duplicating it — one definition, three triggers.
on:
  pull_request:
    branches:
      - develop
  workflow_call:
    inputs:
      ref:
        description: >-
          Git ref to verify. Needed because GitHub runs scheduled workflows from
          the DEFAULT branch (main), so the nightly must ask for develop
          explicitly. Empty = checkout's default (correct for PRs).
        type: string
        required: false
        default: ''

concurrency:
  # Supersede stale runs on a PR, but NEVER cancel a canary/nightly run: every
  # merged state must actually get verified.
  group: verify-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Callers (canary.yml) need to tell "the code is broken" from "verification
    # could not run". Only the gate knows, so it publishes it (#398).
    outputs:
      status: ${{ steps.gate.outputs.status }}
    env:
      # Routing overlay = base + dev + routing. Odoo runs workers=0 here, so the
      # realtime bus stays on :8069 and matches the dev Nginx /websocket route.
      # See e2e/README.md — running workers>0 without repointing Nginx to :8072
      # breaks the web client.
      COMPOSE_FILE: docker-compose.yml:docker-compose.dev.yml:docker-compose.routing.yml

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Empty on pull_request (checkout picks the merge ref itself); the
          # nightly passes 'develop' so it does not silently verify main.
          ref: ${{ inputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # ./oca is GENERATED (P1-T04): the base compose mounts it, so the stack
      # will not boot without it.
      - name: Aggregate pinned OCA repos
        run: |
          pip install 'git-aggregator==4.1'
          # Seven external repositories are cloned on EVERY run. A transient
          # TLS/network failure here skipped every suite and produced a
          # "develop is broken" issue blaming a docs-only commit (#397/#398):
          #   fatal: server certificate verification failed. CAfile: none
          # R-018 says re-run before trusting a scary finding; here the machine
          # can do that itself.
          ok=""
          for attempt in 1 2 3; do
            if gitaggregate -c repos.yml -j 3; then ok=1; break; fi
            echo "::warning::OCA aggregation attempt $attempt failed; retrying in 15s"
            sleep 15
          done
          if [ -z "$ok" ]; then
            echo "::error::OCA aggregation failed after 3 attempts — verification could not run."
            exit 1
          fi

      # Both fixture namespaces: routing owns rt*, e2e owns
      # e2e*. verify_routing.sh uses curl --resolve, but Chromium needs real
      # resolution for the e2e hosts.
      - name: Map fixture hostnames to 127.0.0.1
        run: |
          echo "127.0.0.1 rtclienta.localhost rtclientb.localhost rtadmin.localhost" | sudo tee -a /etc/hosts
          echo "127.0.0.1 e2eclienta.localhost e2eclientb.localhost e2eadmin.localhost" | sudo tee -a /etc/hosts

      - name: Start the routing stack (db_filter ON, workers=0)
        run: docker compose up -d

      - name: Wait for Odoo to become healthy
        run: |
          for _ in $(seq 1 40); do
            if docker compose exec -T odoo curl -sf http://localhost:8069/web/health >/dev/null 2>&1; then
              echo "Odoo is up."
              exit 0
            fi
            sleep 3
          done
          echo "Odoo did not become healthy in time."
          docker compose logs odoo
          exit 1

      # ---- Suite 1: routing & tenant isolation (P1-T06) ----------------------
      - name: Routing & isolation proof
        id: routing
        continue-on-error: true
        run: ./scripts/routing/verify_routing.sh

      # ---- Suite 2: end-to-end platform guarantees (P1-T20) ------------------
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      # Type errors catch hallucinated/renamed API signatures before they reach
      # review — cheap gate, high value on an AI-assisted codebase.
      - name: E2E typecheck
        id: typecheck
        continue-on-error: true
        working-directory: e2e
        run: npm run typecheck

      - name: Install Playwright (chromium)
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      # ORDERING MATTERS: this step restarts Odoo, which also clears the
      # saturation left behind by the routing suite above. Odoo runs workers=0
      # here (single-threaded), so running the browser journeys straight after
      # the routing suite WITHOUT this restart makes logins time out — measured,
      # not theoretical. Do not reorder these two steps.
      - name: Set up E2E tenants
        id: e2esetup
        continue-on-error: true
        run: bash e2e/scripts/setup_e2e_tenants.sh

      - name: E2E suite
        id: e2e
        continue-on-error: true
        working-directory: e2e
        run: npx playwright test

      # ---- Report + gate ----------------------------------------------------
      - name: Results summary
        if: always()
        run: |
          {
            echo "## Verification results"
            echo ""
            echo "| Suite | Result |"
            echo "|---|---|"
            echo "| Routing & isolation (P1-T06) | ${{ steps.routing.outcome }} |"
            echo "| E2E typecheck | ${{ steps.typecheck.outcome }} |"
            echo "| E2E tenant setup | ${{ steps.e2esetup.outcome }} |"
            echo "| E2E guarantees (P1-T20) | ${{ steps.e2e.outcome }} |"
            echo ""
            echo "_Provisioning (P2-T01) runs locally via \`make verify-all\` — it is documented as not a CI test._"
          } >> "$GITHUB_STEP_SUMMARY"

      # A SKIPPED suite is not a FAILING one. Skipped means a precondition —
      # checkout, OCA aggregation, the stack — never came up, so nothing was
      # measured; the code under test is unproven, not broken. Both still fail
      # the job (an unverified merge is not acceptable either), but they are
      # reported differently, and canary.yml uses `status` to decide whether it
      # is entitled to blame a commit (#398).
      - name: Gate — fail if any suite failed
        id: gate
        if: always()
        run: |
          rc=0; any_failed=""; any_skipped=""
          for pair in \
            "routing:${{ steps.routing.outcome }}" \
            "typecheck:${{ steps.typecheck.outcome }}" \
            "e2e-setup:${{ steps.e2esetup.outcome }}" \
            "e2e:${{ steps.e2e.outcome }}"; do
            name="${pair%%:*}"; outcome="${pair##*:}"
            if [ "$outcome" = "skipped" ]; then
              echo "::error::suite '$name' did NOT RUN (outcome: skipped) — a precondition failed, so nothing was measured"
              any_skipped=1; rc=1
            elif [ "$outcome" != "success" ]; then
              echo "::error::suite '$name' FAILED (outcome: $outcome)"
              any_failed=1; rc=1
            fi
          done
          if [ -n "$any_failed" ]; then status=suite-failed
          elif [ -n "$any_skipped" ]; then status=setup-failed
          else status=ok; fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "verify status: $status"
          exit "$rc"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Dump Odoo logs on failure
        if: failure()
        run: docker compose logs --tail=200 odoo || true

      - name: Tear down
        if: always()
        run: docker compose down -v
