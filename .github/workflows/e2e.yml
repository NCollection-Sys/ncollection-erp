name: NCollection ERP E2E

# P1-T20 — Playwright end-to-end suite. Runs on every PR to develop, drives the
# REAL multi-tenant stack through the Nginx edge with db_filter ON (the P1-T06
# routing overlay), and enforces the platform's core guarantees: subdomain->DB
# routing, session isolation, per-plan module visibility, license enforcement,
# owner-only menus, and the "no Odoo in public URLs" brand rule.
#
# Kept as a SEPARATE workflow from ci.yml so the heavy browser+stack run is
# isolated from the fast unit gates and can be retried independently.
on:
  pull_request:
    branches:
      - develop

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    # Hard cap. Target is < 10 min (acceptance); the long pole is OCA
    # aggregation + tenant DB creation, not the suite itself (~15s locally).
    timeout-minutes: 15
    env:
      # Drives every `docker compose` invocation in this job (including the ones
      # inside setup_e2e_tenants.sh) onto the routing overlay = base + dev +
      # routing. The routing overlay runs Odoo with workers=0, so the realtime
      # bus stays on :8069 and matches the dev Nginx `/websocket` route — the
      # port contract the suite depends on (see e2e/README.md).
      COMPOSE_FILE: docker-compose.yml:docker-compose.dev.yml:docker-compose.routing.yml

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ./oca is GENERATED (P1-T04): the base compose mounts it, so the stack
      # will not boot without it. Same aggregation ci.yml uses.
      - name: Aggregate pinned OCA repos
        run: |
          pip install 'git-aggregator==4.1'
          gitaggregate -c repos.yml -j 3

      # The suite addresses tenants by subdomain; on the runner *.localhost must
      # resolve to the loopback where the Nginx edge is published (:80).
      - name: Map *.localhost to 127.0.0.1
        run: |
          echo "127.0.0.1 clienta.localhost clientb.localhost admin.localhost" | sudo tee -a /etc/hosts

      - name: Start the routing stack (db_filter ON, workers=0)
        run: docker compose up -d

      - name: Wait for Odoo to become healthy
        run: |
          for _ in $(seq 1 40); do
            if docker exec ncollection-odoo curl -sf http://localhost:8069/web/health >/dev/null 2>&1; then
              echo "Odoo is up."
              exit 0
            fi
            sleep 3
          done
          echo "Odoo did not become healthy in time."
          docker compose logs odoo
          exit 1

      # Creates clienta (Pro: crm+sale) / clientb (Basic: crm) / admin, seeds the
      # per-plan allowed_module_names + the non-system `biz` user, then restarts
      # Odoo+Nginx to refresh the per-process @ormcache and Nginx's upstream IP.
      - name: Set up E2E tenants
        run: bash e2e/scripts/setup_e2e_tenants.sh

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright (chromium)
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        working-directory: e2e
        run: npx playwright test

      # Traces / screenshots / videos + the HTML report, uploaded only when the
      # suite fails so a red run is debuggable without re-running locally.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Dump Odoo logs on failure
        if: failure()
        run: docker compose logs --tail=200 odoo || true

      - name: Tear down
        if: always()
        run: docker compose down -v
