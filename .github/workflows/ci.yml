name: NCollection ERP CI

on:
  pull_request:
    branches:
      - develop
      - main

# Cancel superseded runs on the same PR so architecture-guard always diffs
# against the latest push, not a stale one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pylint-odoo

      - name: Run flake8
        run: flake8 custom_addons/

      # Fast XML well-formedness gate over OUR addons only (not the
      # aggregated ./oca tree). pylint-odoo checks XML semantics; this
      # catches malformed XML before the slower test job has to install it.
      - name: Validate XML (well-formedness)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libxml2-utils
          find custom_addons -name '*.xml' -print0 | xargs -0 -r xmllint --noout

      # Shell scripts had NO linting in CI until now — yet that is exactly where
      # our real infra bugs lived (a psql call missing -d silently disabled the
      # routing suite's idempotency). CLAUDE.md mandated shellcheck locally; CI
      # now enforces it, closing the promise-vs-enforcement drift.
      - name: Run shellcheck
        run: |
          command -v shellcheck >/dev/null || {
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends shellcheck
          }
          # .githooks/* are shell too but carry no .sh extension — include them.
          {
            find . -name '*.sh' -not -path './oca/*' -not -path '*/node_modules/*'
            find .githooks -type f 2>/dev/null || true
          } | xargs -r shellcheck

      # Infrastructure invariants — companion to architecture-guard (which covers
      # the addon surface). Each rule encodes a bug we actually diagnosed; see
      # scripts/ci/invariants.py for the provenance of each one.
      # Before the guard itself: if its own rules are broken, a "clean" scan
      # means nothing. Pure stdlib unittest on temp dirs — no Docker, no DB,
      # ~0.02s (#330).
      - name: Test the invariants guard
        run: python scripts/ci/test_invariants.py

      - name: Run invariants guard
        run: python scripts/ci/invariants.py

      # #382: docs/ROLE_MATRIX.md is described in hooks.py as authoritative and
      # was enforced by nothing — the tests compared two Python copies to each
      # other and never opened the document. This runs on the HOST because the
      # odoo container mounts only custom_addons/ and oca/, so an Odoo test
      # physically cannot read docs/.
      - name: Test the role-matrix guard
        run: python scripts/ci/test_check_role_matrix.py

      - name: Check the role matrix matches the code
        run: python scripts/ci/check_role_matrix.py

      # #405: TESTING_STRATEGY.md's counts went stale within a day of #394
      # re-measuring them by hand. CLAUDE.md points at that document for "what
      # a green result actually proves", so a stale answer is worse than none.
      - name: Test the doc-counts guard
        run: python scripts/ci/test_check_doc_counts.py

      # #408 also covers CLAUDE.md, which is auto-loaded into every session —
      # a wrong number there is repeated to every future reader.
      - name: Check TESTING_STRATEGY.md and CLAUDE.md counts match the tree
        run: python scripts/ci/check_doc_counts.py

      # The AI gateway satellite (#59) is NOT an Odoo module, so the `test` job
      # below never sees it — `--test-tags` scopes that run to custom_addons.
      # Without this step its 28 tests would exist and never execute, which is
      # the "inert test" failure this repo has already been bitten by (ci.yml's
      # own `hr` comment: "a skipped test is not a passing test").
      #
      # Runs in `lint` rather than `test` because it needs neither Postgres nor
      # Odoo: pure stdlib, injected clocks, ~5s, no network.
      - name: Test the AI gateway satellite
        run: |
          python satellites/ai_gateway/test_ai_gateway.py
          python satellites/ai_gateway/test_gateway_http.py

      # pylint-odoo. The gate — the baseline, its full provenance history, the
      # invocation, the scanned tree and the finding-count pattern — lives in
      # scripts/ci/pylint_gate.sh so that .githooks/pre-push runs the IDENTICAL
      # check before a push (#267). It used to be inline here only, which made
      # this the one gate a developer could not see before pushing.
      # No --allow-missing: a missing pylint in CI is a broken image, not a skip.
      - name: Run pylint-odoo (fails only on NEW findings beyond baseline)
        run: bash scripts/ci/pylint_gate.sh

  # Supply-chain security scanning (P1-T05). NON-BLOCKING by design
  # (continue-on-error) — the issue mandates "non-blocking warnings
  # initially" so a fresh advisory never stops a merge; the reports still
  # surface on every PR (job summary + uploaded artifacts). Runs in PARALLEL
  # with lint so it does not extend the critical path. Flip continue-on-error
  # off once the advisory backlog is triaged.
  security-scan:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: pip-audit (Python dependency advisories)
        run: |
          python -m pip install --upgrade pip pip-audit
          # Audit the pinned runtime/tooling requirements if present, else the
          # environment. --strict off: report, never fail (non-blocking phase).
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt --desc --format markdown | tee pip-audit-report.md || true
          else
            pip-audit --desc --format markdown | tee pip-audit-report.md || true
          fi

      - name: Trivy (filesystem vulnerability + secret scan)
        # Pinned to the immutable commit SHA of v0.36.0 (the scanner action
        # itself is a supply-chain surface — pin it, don't float a tag).
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          format: table
          output: trivy-report.txt
          exit-code: '0'            # non-blocking: report only
          severity: CRITICAL,HIGH
          scanners: vuln,secret

      - name: Publish scan summary
        if: always()
        run: |
          {
            echo "## Security scan reports"
            echo "### pip-audit"
            echo '```'
            [ -f pip-audit-report.md ] && cat pip-audit-report.md || echo "no report"
            echo '```'
            echo "### Trivy (CRITICAL/HIGH)"
            echo '```'
            [ -f trivy-report.txt ] && cat trivy-report.txt || echo "no report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-scan-reports
          path: |
            pip-audit-report.md
            trivy-report.txt
          if-no-files-found: ignore

  # Strix (#440) is a hosted GitHub App on a third party's infrastructure, NOT a
  # workflow of ours — it posts through the Checks API, which is why its result
  # links to app.strix.ai instead of an actions run. It cannot be "added to CI";
  # the only thing we control is whether it is asked to look AGAIN.
  #
  # THE PROBLEM IS NOT THAT IT SKIPS PRs. It reviewed 6 of the last 7. The
  # problem is that its verdict goes STALE and then becomes INVISIBLE: it stamps
  # the commit it reviewed ("Updated for `<sha>`"), and its check run is bound
  # to that commit. Push again and the check does not appear on the new head at
  # all — not as "stale", but as nothing. Measured:
  #
  #     #433  reviewed 8bfa29b   head ffb4087   <- later commits never reviewed
  #     #426  reviewed ef23913   head 9a19574   <- same
  #
  # Both merged that way. Anyone gating on `gh pr checks` sees no Strix row and
  # reads it as "not configured" rather than "your last commits are unreviewed".
  #
  # Worth fixing rather than dropping: on #430 Strix filed a HIGH that four
  # internal reviewers and the whole suite missed — audit managers could REWRITE
  # sealed rows, because removing perm_unlink only stopped them DELETING.
  #
  # This job lives in ci.yml deliberately. A new .github/workflows/*.yml added
  # via develop would be INERT: close-linked-issues.yml and deploy-staging.yml
  # are both in that state right now, present on develop, absent from main, and
  # neither has ever run.
  #
  # No `needs:`, so it runs alongside lint/test/build and gates nothing.
  strix-review-request:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write   # the only scope this needs: post one comment
    steps:
      - name: Re-request a Strix review when its verdict is stale
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          short="${HEAD_SHA:0:7}"

          # One line per comment, author first, so the stamp can be read from
          # STRIX's comments only. Reading every comment would let anyone who
          # quotes Strix ("Updated for `abc1234`") move the marker, and a
          # quoted stale sha would suppress the re-request this job exists for.
          comments=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
                       --jq '.[] | "\(.user.login)\t\(.body | gsub("\n"; " "))"')

          # Idempotent PER COMMIT, not per PR: re-requesting on a new head is
          # the entire point, but asking twice for the SAME head would spam on
          # every re-run.
          # OUR OWN marker, from OUR OWN bot. Matching it in anyone's comment
          # was a suppression vector — Strix found it on this very PR: a person
          # who can comment can pre-seed `ci:strix-requested:<sha>` for a commit
          # they are about to push, and this job would then skip the review it
          # exists to force. Author-filtered here for exactly the reason the
          # stamp below is; getting one right and not the other was the bug.
          if printf '%s\n' "$comments" | grep '^github-actions\[bot\]' \
               | grep -q "ci:strix-requested:$short"; then
            echo "Already requested a review for $short — not asking twice."
            exit 0
          fi

          # Strix stamps the commit it reviewed. If that is already this head,
          # its verdict is current and there is nothing to ask for.
          # A CAPTURE, not two greps. Piping the matched phrase into
          # `grep -oE '[0-9a-f]+'` looked equivalent and was not: the words
          # "Updated" and "for" are themselves made of hex characters, so it
          # emitted `d`, `a`, `ed`, `f` and then the sha, and the comparison
          # below saw the wrong token — reporting a CURRENT verdict as stale.
          #
          # shellcheck disable=SC2016  # the backticks are LITERAL — part of
          # Strix's markdown ("Updated for `abc1234`"), not a substitution.
          reviewed=$(printf '%s\n' "$comments" \
            | grep '^strix-security\[bot\]' \
            | sed -nE 's/.*Updated for `([0-9a-f]{7,40})`.*/\1/p' | tail -1)

          if [ -n "$reviewed" ] && [ "$reviewed" = "$short" ]; then
            echo "Strix already reviewed $short — verdict is current."
            exit 0
          fi

          if [ -n "$reviewed" ]; then
            echo "Strix reviewed $reviewed but head is $short — stale, re-requesting."
          else
            echo "No Strix review on this PR yet — requesting one."
          fi

          # Their documented trigger, from Strix's own PR comment:
          # "tag @strix-security in a PR comment to run a fresh review."
          #
          # Built with printf so every line reaches GitHub at column 0. Quoting
          # a multi-line string inline would carry this file's indentation into
          # the comment, and four leading spaces make Markdown render the rest
          # as a code block.
          body=$(printf '%s\n' \
            '@strix-security' \
            '' \
            "<!-- ci:strix-requested:$short -->" \
            "<sub>Requested by ci.yml (#440) because Strix's verdict did not" \
            "cover \`$short\`. Its check run is bound to the commit it reviewed," \
            'so after a later push it vanishes from the head rather than showing' \
            'as stale — #433 and #426 were both merged that way.</sub>')

          gh pr comment "$PR" --repo "$REPO" --body "$body"
          echo "Requested a Strix review of $short on PR #$PR."

  architecture-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # architecture_guard.py diffs against origin/develop

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # Before the guard itself: a guard whose own behaviour is unverified
      # fails in the one direction nobody notices — passing when it should not.
      - name: Test architecture-guard
        run: python scripts/ci/test_architecture_guard.py

      - name: Test the skip gate
        run: python scripts/ci/test_check_skips.py

      - name: Run architecture-guard
        run: python scripts/ci/architecture_guard.py --base origin/${{ github.base_ref }}

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ./oca is GENERATED (P1-T04): aggregate the pinned OCA repos from
      # repos.yml so the test container resolves the exact same code as every
      # dev machine (that is the whole point of the pin list).
      - name: Aggregate pinned OCA repos
        run: |
          pip install 'git-aggregator==4.1'
          gitaggregate -c repos.yml -j 3

      # The `postgres` service container above is published to the runner's
      # localhost via `ports: 5432:5432` (this is how GitHub Actions service
      # containers work for non-containerized jobs — see
      # https://docs.github.com/actions/using-containerized-services/about-service-containers).
      # A nested `docker run` here is a SEPARATE container from the runner's
      # own network namespace, so it cannot reach the service via `localhost`
      # unless it also runs with --network host, which shares the runner
      # VM's network namespace (and therefore does reach the published
      # port). CONFIRMED WORKING by the first live run (PR #104).
      #
      # `hr` is installed even though NO ncollection addon depends on it.
      # ncollection_core's KPI tests (P4-T02) cover employee turnover, which
      # needs hr.employee; without hr present those tests call skipTest and
      # CI reports green having never run them. A skipped test is not a
      # passing test. sale and stock already arrive transitively via
      # ncollection_approvals and ncollection_data_import.
      # --test-tags scopes the test run to OUR modules. Without it,
      # --test-enable also runs Odoo core's own suite (base, web, …), and
      # core's CLI self-tests (test_cli) fail inside this container —
      # proven by the first live run.
      - name: Install addons and run tests
        run: |
          docker run --rm \
            --network host \
            -e HOST=localhost -e USER=odoo -e PASSWORD=odoo \
            -v "${{ github.workspace }}/custom_addons:/mnt/extra-addons" \
            -v "${{ github.workspace }}/oca:/mnt/oca-addons" \
            odoo:19 \
            odoo --db_host=localhost --db_user=odoo --db_password=odoo \
                 --addons-path=/mnt/extra-addons,/mnt/oca-addons/account-financial-reporting,/mnt/oca-addons/account-financial-tools,/mnt/oca-addons/mis-builder,/mnt/oca-addons/reporting-engine,/mnt/oca-addons/queue,/mnt/oca-addons/server-auth,/mnt/oca-addons/server-tools,/mnt/oca-addons/server-ux,/mnt/oca-addons/helpdesk,/usr/lib/python3/dist-packages/odoo/addons \
                 -d ci_test \
                 -i hr,account_asset_management,auditlog,ncollection_core,ncollection_ai,ncollection_branding,ncollection_subscription,ncollection_saas,ncollection_billing,ncollection_mis_templates,ncollection_auth,ncollection_account_core,ncollection_account_localization_uae,ncollection_api,ncollection_approvals,ncollection_audit,ncollection_account_reports,ncollection_account_analytics,ncollection_account_budget,ncollection_account_assets,ncollection_account_dashboard,ncollection_data_import,ncollection_reseller,account_financial_report,ncollection_helpdesk \
                 --test-enable \
                 --test-tags /ncollection_core,/ncollection_ai,/ncollection_branding,/ncollection_subscription,/ncollection_saas,/ncollection_billing,/ncollection_mis_templates,/ncollection_auth,/ncollection_account_core,/ncollection_account_localization_uae,/ncollection_api,/ncollection_approvals,/ncollection_audit,/ncollection_account_reports,/ncollection_account_analytics,/ncollection_account_budget,/ncollection_account_assets,/ncollection_account_dashboard,/ncollection_data_import,/ncollection_reseller,/ncollection_helpdesk \
                 --stop-after-init --log-level=test \
            2>&1 | tee odoo-test.log
          test "${PIPESTATUS[0]}" -eq 0

      - name: Fail on tracebacks in log (Odoo can exit 0 on some test failures)
        run: (! grep -i "traceback (most recent call last)" odoo-test.log)

      # Companion to the line above, for the other way Odoo reports green
      # having covered nothing: a SKIPPED test is counted as passing. #363's
      # four browser tours skipped on a missing Chrome and reported
      # "0 failed, 0 error(s) of 4 tests". Keyed on test identity rather than
      # on the skip reason — see the module docstring for why the obvious
      # alternative allowlists exactly the dangerous case.
      - name: Fail on unexpected skips (a skipped test is not a passing test)
        run: python scripts/ci/check_skips.py odoo-test.log

  build:
    runs-on: ubuntu-latest
    needs: [lint, architecture-guard, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Base compose mounts ./oca (P1-T04); without aggregation Docker would
      # auto-create it empty and Odoo would hard-fail on the missing
      # per-repo addons_path entries.
      - name: Aggregate pinned OCA repos
        run: |
          pip install 'git-aggregator==4.1'
          gitaggregate -c repos.yml -j 3

      - name: Build and start stack
        run: docker compose up -d

      # On a fresh stack (no database yet — always the case in CI),
      # /web/login answers 303 -> the database-selector page, so we must
      # follow redirects (-L) and accept that page as proof of life.
      # Proven by the first live run (PR #104): without -L the body is
      # empty and the grep fails.
      - name: Wait for Odoo to respond
        run: |
          for _ in $(seq 1 30); do
            if curl -sfL http://localhost:8069/web/login > /dev/null; then
              echo "Odoo is up."
              exit 0
            fi
            sleep 5
          done
          echo "Odoo did not become healthy in time."
          docker compose logs
          exit 1

      - name: Smoke test — login (or database-selector) page loads
        run: curl -sfL http://localhost:8069/web/login | grep -qiE "odoo|login|database"

      - name: Tear down
        if: always()
        run: docker compose down -v
