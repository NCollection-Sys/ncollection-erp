name: NCollection ERP CI

on:
  pull_request:
    branches:
      - develop
      - main

# Cancel superseded runs on the same PR so architecture-guard always diffs
# against the latest push, not a stale one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pylint-odoo

      - name: Run flake8
        run: flake8 custom_addons/

      # Fast XML well-formedness gate over OUR addons only (not the
      # aggregated ./oca tree). pylint-odoo checks XML semantics; this
      # catches malformed XML before the slower test job has to install it.
      - name: Validate XML (well-formedness)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libxml2-utils
          find custom_addons -name '*.xml' -print0 | xargs -0 -r xmllint --noout

      # Shell scripts had NO linting in CI until now — yet that is exactly where
      # our real infra bugs lived (a psql call missing -d silently disabled the
      # routing suite's idempotency). CLAUDE.md mandated shellcheck locally; CI
      # now enforces it, closing the promise-vs-enforcement drift.
      - name: Run shellcheck
        run: |
          command -v shellcheck >/dev/null || {
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends shellcheck
          }
          # .githooks/* are shell too but carry no .sh extension — include them.
          {
            find . -name '*.sh' -not -path './oca/*' -not -path '*/node_modules/*'
            find .githooks -type f 2>/dev/null || true
          } | xargs -r shellcheck

      # Infrastructure invariants — companion to architecture-guard (which covers
      # the addon surface). Each rule encodes a bug we actually diagnosed; see
      # scripts/ci/invariants.py for the provenance of each one.
      - name: Run invariants guard
        run: python scripts/ci/invariants.py

      # pylint-odoo currently reports 62 pre-existing findings across the
      # addons (missing README.rst, superfluous/deprecated manifest keys,
      # redundant `string=` attrs — measured directly, see
      # docs/markdown/PLANNING_REVIEW.md backlog). Baseline history:
      #   42 → 60 (2026-07-19): PR #132 merged main into develop bringing
      #   the demo-sprint addons (tenant_wizard, module, dashboard,
      #   provisioning_job, mis_templates, demo_freshorigin) whose W8113/
      #   C8113 debt was never counted — lint only runs on PRs, so the
      #   first PR after that merge inherited the bill (see PR #133).
      #   Paying this down is backlog work, not per-PR work.
      #   60 → 61 (2026-07-27): F1-T01 (#109) adds ncollection_account_core.
      #   Its manifest trips the one unavoidable manifest-required-author
      #   (C8101) finding every ncollection_* manifest already has — we are a
      #   proprietary project, not OCA. The 3 superfluous manifest-key
      #   findings were AVOIDED by omitting installable/application/auto_install
      #   (all Odoo defaults), so this bumps the count by exactly 1.
      #   61 → 62 (2026-07-27): F5-T01 (#126) adds
      #   ncollection_account_localization_uae — same single unavoidable
      #   manifest-required-author (C8101); +1.
      #   62 → 55 (2026-07-28): #226 removes the dead, never-loaded
      #   ncollection.tenant.wizard (a demo-sprint addon called out above),
      #   paying down the 7 W8113/C8113 findings it carried.
      #   55 → 56 (2026-07-30): P3-T07 (#47) adds ncollection_approvals — the
      #   single unavoidable manifest-required-author (C8101); +1.
      #   56 → 57 (2026-08-01): P3-T11 (#51) adds ncollection_data_import — the
      #   single unavoidable manifest-required-author (C8101); the 3 superfluous
      #   manifest-key findings were AVOIDED (installable/application/assets
      #   omitted), so +1.
      # Rather than a blanket
      # continue-on-error (which would hide a PR introducing brand-new
      # findings just as easily as it hides the old ones), this fails ONLY
      # if the finding count goes above the current baseline — so new
      # violations still fail the build, old debt doesn't. Once the backlog
      # is paid down, delete PYLINT_BASELINE and drop the comparison so any
      # finding fails the job.
      - name: Run pylint-odoo (fails only on NEW findings beyond baseline)
        run: |
          PYLINT_BASELINE=57
          set +e
          pylint --load-plugins=pylint_odoo -d all -e odoolint custom_addons/ | tee pylint.log
          COUNT=$(grep -cE ": [CWEF][0-9]{4}: " pylint.log)
          set -e
          echo "pylint-odoo findings: $COUNT (baseline: $PYLINT_BASELINE)"
          if [ "$COUNT" -gt "$PYLINT_BASELINE" ]; then
            echo "New pylint-odoo findings introduced ($COUNT > baseline $PYLINT_BASELINE) — see log above."
            exit 1
          fi

  # Supply-chain security scanning (P1-T05). NON-BLOCKING by design
  # (continue-on-error) — the issue mandates "non-blocking warnings
  # initially" so a fresh advisory never stops a merge; the reports still
  # surface on every PR (job summary + uploaded artifacts). Runs in PARALLEL
  # with lint so it does not extend the critical path. Flip continue-on-error
  # off once the advisory backlog is triaged.
  security-scan:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: pip-audit (Python dependency advisories)
        run: |
          python -m pip install --upgrade pip pip-audit
          # Audit the pinned runtime/tooling requirements if present, else the
          # environment. --strict off: report, never fail (non-blocking phase).
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt --desc --format markdown | tee pip-audit-report.md || true
          else
            pip-audit --desc --format markdown | tee pip-audit-report.md || true
          fi

      - name: Trivy (filesystem vulnerability + secret scan)
        # Pinned to the immutable commit SHA of v0.36.0 (the scanner action
        # itself is a supply-chain surface — pin it, don't float a tag).
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          format: table
          output: trivy-report.txt
          exit-code: '0'            # non-blocking: report only
          severity: CRITICAL,HIGH
          scanners: vuln,secret

      - name: Publish scan summary
        if: always()
        run: |
          {
            echo "## Security scan reports"
            echo "### pip-audit"
            echo '```'
            [ -f pip-audit-report.md ] && cat pip-audit-report.md || echo "no report"
            echo '```'
            echo "### Trivy (CRITICAL/HIGH)"
            echo '```'
            [ -f trivy-report.txt ] && cat trivy-report.txt || echo "no report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-scan-reports
          path: |
            pip-audit-report.md
            trivy-report.txt
          if-no-files-found: ignore

  architecture-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # architecture_guard.py diffs against origin/develop

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Run architecture-guard
        run: python scripts/ci/architecture_guard.py --base origin/${{ github.base_ref }}

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # ./oca is GENERATED (P1-T04): aggregate the pinned OCA repos from
      # repos.yml so the test container resolves the exact same code as every
      # dev machine (that is the whole point of the pin list).
      - name: Aggregate pinned OCA repos
        run: |
          pip install 'git-aggregator==4.1'
          gitaggregate -c repos.yml -j 3

      # The `postgres` service container above is published to the runner's
      # localhost via `ports: 5432:5432` (this is how GitHub Actions service
      # containers work for non-containerized jobs — see
      # https://docs.github.com/actions/using-containerized-services/about-service-containers).
      # A nested `docker run` here is a SEPARATE container from the runner's
      # own network namespace, so it cannot reach the service via `localhost`
      # unless it also runs with --network host, which shares the runner
      # VM's network namespace (and therefore does reach the published
      # port). CONFIRMED WORKING by the first live run (PR #104).
      #
      # --test-tags scopes the test run to OUR modules. Without it,
      # --test-enable also runs Odoo core's own suite (base, web, …), and
      # core's CLI self-tests (test_cli) fail inside this container —
      # proven by the first live run.
      - name: Install addons and run tests
        run: |
          docker run --rm \
            --network host \
            -e HOST=localhost -e USER=odoo -e PASSWORD=odoo \
            -v "${{ github.workspace }}/custom_addons:/mnt/extra-addons" \
            -v "${{ github.workspace }}/oca:/mnt/oca-addons" \
            odoo:19 \
            odoo --db_host=localhost --db_user=odoo --db_password=odoo \
                 --addons-path=/mnt/extra-addons,/mnt/oca-addons/account-financial-reporting,/mnt/oca-addons/mis-builder,/mnt/oca-addons/reporting-engine,/mnt/oca-addons/queue,/mnt/oca-addons/server-auth,/mnt/oca-addons/server-tools,/mnt/oca-addons/server-ux,/usr/lib/python3/dist-packages/odoo/addons \
                 -d ci_test \
                 -i ncollection_core,ncollection_branding,ncollection_subscription,ncollection_saas,ncollection_billing,ncollection_mis_templates,ncollection_auth,ncollection_account_core,ncollection_account_localization_uae,ncollection_approvals,ncollection_account_reports,ncollection_data_import \
                 --test-enable \
                 --test-tags /ncollection_core,/ncollection_branding,/ncollection_subscription,/ncollection_saas,/ncollection_billing,/ncollection_mis_templates,/ncollection_auth,/ncollection_account_core,/ncollection_account_localization_uae,/ncollection_approvals,/ncollection_account_reports,/ncollection_data_import \
                 --stop-after-init --log-level=test \
            2>&1 | tee odoo-test.log
          test "${PIPESTATUS[0]}" -eq 0

      - name: Fail on tracebacks in log (Odoo can exit 0 on some test failures)
        run: (! grep -i "traceback (most recent call last)" odoo-test.log)

  build:
    runs-on: ubuntu-latest
    needs: [lint, architecture-guard, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Base compose mounts ./oca (P1-T04); without aggregation Docker would
      # auto-create it empty and Odoo would hard-fail on the missing
      # per-repo addons_path entries.
      - name: Aggregate pinned OCA repos
        run: |
          pip install 'git-aggregator==4.1'
          gitaggregate -c repos.yml -j 3

      - name: Build and start stack
        run: docker compose up -d

      # On a fresh stack (no database yet — always the case in CI),
      # /web/login answers 303 -> the database-selector page, so we must
      # follow redirects (-L) and accept that page as proof of life.
      # Proven by the first live run (PR #104): without -L the body is
      # empty and the grep fails.
      - name: Wait for Odoo to respond
        run: |
          for _ in $(seq 1 30); do
            if curl -sfL http://localhost:8069/web/login > /dev/null; then
              echo "Odoo is up."
              exit 0
            fi
            sleep 5
          done
          echo "Odoo did not become healthy in time."
          docker compose logs
          exit 1

      - name: Smoke test — login (or database-selector) page loads
        run: curl -sfL http://localhost:8069/web/login | grep -qiE "odoo|login|database"

      - name: Tear down
        if: always()
        run: docker compose down -v
