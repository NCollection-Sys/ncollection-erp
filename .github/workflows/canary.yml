name: Develop Canary

# THE compensating control for having no branch protection.
#
# Verified constraint: this is a GitHub Free org private repo, so
# `branches/develop/protection` and `/rulesets` both return HTTP 403
# ("Upgrade to GitHub Pro or make this repository public"). Required status
# checks are therefore IMPOSSIBLE — any PR can be merged red.
#
# Since we cannot PREVENT a bad merge, we detect one fast: this re-runs the full
# verification suite against develop after every merge and, on failure, files a
# `broken-develop` issue naming the commit and author. Detection in ~12 minutes
# instead of "whenever someone next trips over it".
#
# Delete this workflow only if the org upgrades and real branch protection is
# switched on (see docs/markdown/BRANCH_PROTECTION.md).
on:
  push:
    branches:
      - develop
  # Lets us prove the auto-issue path works without breaking develop for real.
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: 'Force the suite to fail, to test the auto-issue path'
        type: boolean
        default: false

concurrency:
  group: canary-${{ github.ref }}
  cancel-in-progress: false # every merged state must be verified

jobs:
  verify:
    # Reuses the exact PR suite — one definition, no drift.
    if: ${{ !inputs.simulate_failure }}
    uses: ./.github/workflows/verify.yml

  # The PR-time `architecture-guard` diffs against the PR BASE, so it can only
  # ever see files that PR touched. A violation sitting on develop is therefore
  # invisible to it AND to this canary, which re-runs verify.yml -- and verify.yml
  # has no guard step at all. That is not hypothetical: c6b759f widened the rule to
  # cover ncollection_reseller and merged green while knowingly leaving two live
  # violations behind, and nothing surfaced them again until someone ran the guard
  # by hand with a wide --base (#304). This job closes that hole by checking the
  # WHOLE tree on develop, not a diff. Cheap: no Docker, no database.
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: architecture-guard (full tree, not a diff)
        run: |
          set -euo pipefail
          # xargs, not mapfile: mapfile is bash 4+, and the dev machines here run
          # bash 3.2, so a mapfile version could not be run locally before shipping.
          # -0/-z keeps paths with spaces intact; -r skips the run on an empty list.
          git ls-files -z 'custom_addons/**/*.py' 'custom_addons/**/*.xml' \
            | xargs -0 -r python3 scripts/ci/architecture_guard.py --files

  # Only runs when explicitly asked to simulate, so the alerting path is
  # testable on demand without ever red-flagging a healthy develop.
  simulate:
    if: ${{ inputs.simulate_failure }}
    runs-on: ubuntu-latest
    steps:
      - name: Deliberate failure (auto-issue path test)
        run: |
          echo "::error::simulated failure — exercising the broken-develop alert path"
          exit 1

  report:
    needs: [verify, simulate, guard]
    # always() so this evaluates even though one of the two jobs above is always
    # skipped; then act only if something actually failed.
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: File or update the broken-develop issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # 'setup-failed' = no suite ran, so this commit is not implicated.
          VERIFY_STATUS: ${{ needs.verify.outputs.status }}
        run: |
          set -euo pipefail
          short="${SHA:0:9}"
          subject="$(gh api "repos/$REPO/commits/$SHA" --jq '.commit.message' | head -1)"

          # A SKIPPED suite is not a FAILING one (#398). When setup never came
          # up, nothing about this commit was measured — blaming it, and
          # assigning its author, sends someone to investigate a change that
          # cannot be responsible. #397 did exactly that to a commit touching
          # only CLAUDE.md and TESTING_STRATEGY.md.
          if [ "${VERIFY_STATUS:-}" = "setup-failed" ]; then
            title="⚠️ develop could not be verified (setup failed)"
            headline="**Verification could not run — this is NOT a known-broken develop.**

          Every suite reported \`skipped\`, meaning a precondition (checkout, OCA
          aggregation, or the stack) never came up. Nothing about the commit below was
          measured, so it is recorded for context only and is **not** implicated.
          The OCA aggregation retries 3× before giving up, so a single transient
          network failure will not reach here."
            assignee=""
          else
            title="🔴 develop is broken by $short"
            headline="**develop is failing verification.**"
            assignee="$ACTOR"
          fi

          body=$(cat <<EOF
          $headline

          | | |
          |---|---|
          | Commit | \`$short\` — $subject |
          | Pushed by | @$ACTOR |
          | Failing run | $RUN_URL |

          Because this repo has no branch protection (GitHub Free private repos cannot
          enable it), CI could not block this. Treat a red develop as the top priority:
          fix forward or revert \`$short\` before merging anything else — but check the
          failing step first: if it is setup rather than a suite, the commit is innocent
          and the fix belongs in the harness (#398).

          Reproduce locally:
          \`\`\`bash
          make routing-up
          make verify-all
          \`\`\`
          EOF
          )

          # Idempotent: ensure the label exists before using it.
          gh label create broken-develop \
            --repo "$REPO" \
            --color B60205 \
            --description "develop is failing verification — fix before merging anything else" \
            --force >/dev/null 2>&1 || true

          existing=$(gh issue list --repo "$REPO" --label broken-develop --state open \
                       --limit 1 --json number --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            echo "develop already flagged in #$existing — commenting instead of duplicating."
            gh issue comment "$existing" --repo "$REPO" --body "$body"
          else
            if [ -n "$assignee" ]; then
              gh issue create --repo "$REPO" \
                --title "$title" \
                --label broken-develop \
                --body "$body" \
                --assignee "$assignee" \
                || gh issue create --repo "$REPO" \
                     --title "$title" \
                     --label broken-develop \
                     --body "$body"
            else
              # No assignee on a setup failure: there is nobody to assign it to.
              gh issue create --repo "$REPO" \
                --title "$title" \
                --label broken-develop \
                --body "$body"
            fi
          fi
