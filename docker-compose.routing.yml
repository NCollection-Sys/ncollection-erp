# ============================================================================
#  Routing-verification overlay  (ticket P1-T06 — OPT-IN, dev only)
# ============================================================================
#  Layer this ON TOP of base + dev to turn on real subdomain->database routing
#  locally, so `rtclienta.localhost -> DB rtclienta` can be PROVEN:
#
#    docker compose -f docker-compose.yml -f docker-compose.dev.yml \
#                   -f docker-compose.routing.yml up -d
#    (or: make routing-up)
#
#  It reuses the T03 dev Nginx block as-is (nginx/conf.d/ncollection.dev.conf
#  already routes *.localhost and forwards `Host`). The ONLY thing it changes is
#  Odoo's command, switching on the multi-tenant filter that the permissive
#  default dev stack deliberately leaves off:
#    - db_filter = ^%d$   -> route each request to the DB named after its
#                            subdomain (%d = first hostname component).
#    - list_db  = False   -> hide the database selector entirely.
#    - proxy_mode = True  -> trust Nginx's forwarded Host/scheme.
#
#  `make up` (base + dev) is UNCHANGED and stays permissive (list_db=True) for
#  everyday work — this overlay is the routing proof AND the demo/SaaS stack
#  (`make saas-up` is an alias for `routing-up`; #453). Entry points, the
#  platform-vs-tenant URL map and the login flow are documented in
#  docs/markdown/ROUTING.md — the path this comment used to give (docs/ROUTING.md)
#  never existed.
#
#  NOTE: `$$` escapes compose interpolation so Odoo receives a literal `$`.
# ============================================================================
services:

  odoo:
    # --max-cron-threads=0 (#337), and it must be HERE as well as in
    # docker-compose.dev.yml: a service's `command` REPLACES the one from a
    # lower-precedence file rather than merging with it, so the dev override's
    # cron setting does not carry into the routing stack. Fixing only the dev
    # file would have left crons ticking every database on the server for the
    # whole of `make verify-all`, which runs on this stack.
    #
    # Note especially that `--db-filter` on this very line does NOT restrict
    # cron — it filters HTTP routing only. Odoo's cron worker uses
    # `config['db_name'] or list_dbs(True)`, and there is no `-d` here, so
    # without this flag it would tick all ~89 databases. That distinction is
    # the whole of #337.
    #
    # Nothing in the routing/verification suites needs the scheduler: each
    # invokes its cron method directly.
    command: ["odoo", "--db-filter=^%d$$", "--no-database-list", "--proxy-mode", "--log-level=info", "--max-cron-threads=0"]
