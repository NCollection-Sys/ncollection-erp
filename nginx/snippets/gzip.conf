# gzip for static, non-sensitive asset types only.
#
# BREACH note: compressing a response that mixes a secret (e.g. CSRF token)
# with attacker-influenced reflected input can leak the secret. We therefore
# gzip only static asset content types and deliberately do NOT gzip text/html
# (Odoo's dynamic pages that carry tokens).
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types
    text/css
    text/plain
    text/xml
    application/javascript
    application/json
    application/xml
    application/xml+rss
    image/svg+xml;
