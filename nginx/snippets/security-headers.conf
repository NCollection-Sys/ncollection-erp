# Shared security headers (ARCHITECTURE_SECURITY.md Layer 1). Include at the
# server level. HSTS is intentionally NOT here — it belongs only on the HTTPS
# (prod) server, so it lives in ncollection.prod.conf.
#
# `always` = send the header even on error responses (4xx/5xx).

# Clickjacking: the Odoo web client only frames itself.
add_header X-Frame-Options "SAMEORIGIN" always;

# Stop MIME-type sniffing.
add_header X-Content-Type-Options "nosniff" always;

# Leak less on cross-origin navigations.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# CSP: deliberately Odoo-compatible for now. Odoo's web client relies on inline
# scripts/handlers and eval (owl/qweb), so 'unsafe-inline'/'unsafe-eval' are
# required or the backend breaks. frame-ancestors mirrors X-Frame-Options.
# Tightening this (nonces, removing unsafe-*) is a later hardening pass, tracked
# separately — do NOT tighten blindly here or the web client will white-screen.
# connect-src includes ws: AND wss: so the realtime bus is never blocked by our
# own CSP — dev uses ws:// (plain HTTP), prod uses wss://. Silently breaking the
# bus via CSP is the exact failure this ticket guards against.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https: wss: ws:; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
