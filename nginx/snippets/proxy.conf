# Shared proxy parameters — include inside every location that proxy_passes.
# (Nginx quirk: proxy_set_header at a location level DROPS inherited ones, so
#  we re-declare the full set here and `include` it everywhere.)
#
# Host + X-Forwarded-* feed Odoo's proxy_mode=True so Odoo sees the real
# tenant hostname (for db_filter=^%d$) and the real client IP/scheme.
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Real-IP $remote_addr;

# Websocket upgrade support (needed by /websocket; harmless elsewhere).
# $connection_upgrade comes from the `map` defined in the server-block file.
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;

proxy_redirect off;

# Odoo also emits X-Frame-Options / X-Content-Type-Options / CSP of its own.
# Hide the upstream copies so clients see ONLY the edge's single authoritative
# set (security-headers.conf) instead of duplicate/conflicting headers.
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Content-Security-Policy;

# Odoo long-lived requests (reports, the realtime bus) need generous timeouts.
proxy_connect_timeout 720s;
proxy_send_timeout 720s;
proxy_read_timeout 720s;
