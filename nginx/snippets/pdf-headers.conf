# Security headers for a PDF the browser must RENDER in its native viewer (the cheque previews and downloads).
#
# WHY NOT security-headers.conf. Its Content-Security-Policy ends in `object-src 'none'`, which is right for an HTML
# page and wrong for a PDF: Chrome shows a PDF through its built-in viewer (a plugin <embed>), so that directive
# blocks the viewer and the user gets a BLANK page; download managers (IDM) then see a navigation they cannot make
# sense of. A PDF response carries no script and no markup, so it needs only what still matters for a document:
# nobody may frame it from another origin, no MIME sniffing, and no referrer leakage. `add_header` in a location
# REPLACES every inherited one, so the whole set is restated here rather than silently dropped.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "frame-ancestors 'self'" always;
