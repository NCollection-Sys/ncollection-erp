# ==========================================================================
#  Public URL policy (ticket P1-T15) — hide "odoo" from PUBLIC-FACING URLs
# ==========================================================================
#  Included by BOTH server blocks (dev + prod stay in lockstep).
#
#  Scope boundary (accepted trade-off, documented in docs/ROUTING.md):
#  Odoo 19's JavaScript router HARDCODES internal /odoo/... backend paths —
#  rewriting them breaks routing on every upgrade. So the backend keeps its
#  /odoo URLs; we only clean the PUBLIC surfaces (naked domain, login, reset,
#  portal, website).
#
#  The one real public leak (probed live): Odoo answers `GET /` with a
#  303 -> /odoo when no website module is installed, so a prospect's URL bar
#  shows "/odoo". The `location = /` block below rewrites THAT Location header
#  only (scoped proxy_redirect), targeting /web — verified live on Odoo 19:
#    - anonymous visitor:  / -> /web -> 303 /web/login?redirect=%2Fweb%3F
#      (login page, zero "odoo" in the whole chain)
#    - authenticated user: / -> /web -> 200, straight into the backend web
#      client (no detour; bare /web/login would NOT bounce an authed visitor —
#      Odoo 19 only redirects off the login page when a ?redirect= is present,
#      and using ?redirect=/odoo would leak "odoo" right back into the URL)
#    - future website tenants: `/` returns 200 -> proxy_redirect is a NO-OP.
#      Do not "fix" this block when the website module arrives — it is inert.

location = / {
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass http://odoo;
    # Rewrite only an exact ".../odoo" Location answer; regex form catches both
    # relative (/odoo) and absolute (http://host/odoo) redirect headers.
    proxy_redirect ~^(https?://[^/]+)?/odoo/?$ /web;
}

# Marketing-friendly public aliases (301s to the canonical clean URLs). None of
# these paths exist as Odoo routes (404 today — verified), so the edge may own
# them without shadowing anything.
location = /login  { return 301 /web/login; }
location = /signup { return 301 /web/signup; }
location = /reset  { return 301 /web/reset_password; }
location = /portal { return 301 /my; }
