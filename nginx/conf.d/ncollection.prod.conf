# ==========================================================================
#  NCollection ERP — PROD reverse proxy + TLS (ticket P1-T03)
# ==========================================================================
#  *.ncollectionerp.com over HTTPS. Mounted as the active
#  /etc/nginx/conf.d/default.conf by docker-compose.prod.yml.
#
#  ⚠️ WEBSOCKET PORT (the #1 easy-to-miss bug):
#  Prod Odoo runs workers=4 (gevent), so the realtime bus is served by a
#  SEPARATE gevent worker on 8072 (NOT 8069). Routing /websocket to 8069 in
#  prod both breaks the bus AND clogs the HTTP workers. Dev is the opposite
#  (bus on 8069) — that is why dev/prod are two separate files.
#
#  🔐 CERTS: wildcard *.ncollectionerp.com is issued by Certbot via DNS-01.
#  Issue the cert BEFORE the first prod start — nginx will not boot without the
#  cert files below. Full issuance steps + a manual fallback: nginx/README.md.
#  To change the domain, edit this file (templating is a future enhancement).
# ==========================================================================

# --- Upstreams (http context) ---------------------------------------------
# HTTP goes to the pooled `odoo` service (→ PgBouncer); the realtime bus goes to
# the DIRECT-connected `odoo-bus` service (P2-T09, ARCHITECTURE_DATA_PLATFORM
# §4.2 — transaction pooling breaks LISTEN/NOTIFY). Both come from
# docker-compose.pooling.yml, which prod always layers.
upstream odoo     { server odoo:8069; }
upstream odoo_bus { server odoo-bus:8072; }   # PROD: gevent realtime bus, DIRECT to PG

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
# Onboarding-funnel rate limits (P3-T12 / H-1). `checkout` gates the expensive,
# state-changing routes that ultimately trigger CREATE DATABASE / user creation;
# `onboard` gates the lighter read-y probes. Both were missing — the funnel had
# no edge limit at all, so provisioning-spam was throttled only by the app-level
# quota. reCAPTCHA on /nc/checkout/register must also be enabled at go-live (P3-T13).
limit_req_zone $binary_remote_addr zone=checkout:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=onboard:10m rate=60r/m;

# --- HTTP :80 — ACME challenge + redirect everything else to HTTPS ---------
server {
    listen 80;
    server_name .ncollectionerp.com;

    # Let ACME HTTP-01 challenges through (harmless alongside the DNS-01 flow).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS :443 ------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name .ncollectionerp.com;     # apex + any *.ncollectionerp.com tenant

    # Wildcard cert covering *.ncollectionerp.com (one label per tenant).
    ssl_certificate     /etc/letsencrypt/live/ncollectionerp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ncollectionerp.com/privkey.pem;

    # Modern TLS baseline (TLS 1.2 + 1.3, strong GCM ciphers).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 100M;

    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/gzip.conf;

    # Public URL policy (P1-T15): keep "odoo" out of public-facing URLs
    # (location = / rewrite + vanity 301 aliases). Backend /odoo stays as-is.
    include /etc/nginx/snippets/public-urls.conf;

    # HSTS — HTTPS only, so it lives here and NOT in the shared snippet.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /web/database {
        return 403;
    }

    location = /web/login {
        limit_req zone=login burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://odoo;
    }

    # Onboarding funnel (P3-T12 / H-1) — rate-limited at the edge. The strict
    # `checkout` zone covers the state-changing routes: `register` (creates the
    # tenant/subscription row + creates a user), `signup`, and `verify/<token>`
    # (the GET that actually fires provisioning -> CREATE DATABASE via
    # _nc_confirm_checkout). The light probes get the looser `onboard` zone.
    location = /nc/checkout/register {
        limit_req zone=checkout burst=4 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://odoo;
    }
    # verify/<token> is a variable path -> regex match (after the `=` blocks).
    location ~ ^/nc/checkout/verify/ {
        limit_req zone=checkout burst=4 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://odoo;
    }
    location = /ncollection/api/signup {
        limit_req zone=checkout burst=4 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://odoo;
    }
    location = /nc/checkout/availability {
        limit_req zone=onboard burst=20 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://odoo;
    }
    location = /pricing {
        limit_req zone=onboard burst=30 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://odoo;
    }

    location /websocket {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://odoo_bus;
    }
    location /longpolling {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://odoo_bus;
    }

    location / {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://odoo;
    }
}
