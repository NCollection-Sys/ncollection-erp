# ==========================================================================
#  NCollection ERP — DEV reverse proxy (ticket P1-T03)
# ==========================================================================
#  *.localhost over plain HTTP (NO TLS in dev). Mounted as the active
#  /etc/nginx/conf.d/default.conf by docker-compose.dev.yml.
#
#  ⚠️ WEBSOCKET PORT (the #1 easy-to-miss bug):
#  Dev Odoo runs workers=0 (threaded), so the realtime bus (Discuss websocket,
#  live notifications, presence) is served on the SAME port as HTTP — 8069.
#  Prod is the OPPOSITE (gevent bus on 8072; see ncollection.prod.conf), which
#  is why dev and prod are two separate files. Routing /websocket to the wrong
#  port kills live chatter SILENTLY (no error page). Verified on this repo's
#  dev container: 8069 is open and answers /websocket; 8072 is closed.
# ==========================================================================

# --- Upstreams (http context) ---------------------------------------------
upstream odoo     { server odoo:8069; }
upstream odoo_bus { server odoo:8069; }   # DEV: bus is on 8069, NOT 8072

# Websocket Connection header: "upgrade" while upgrading, else "" (close).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Coarse brute-force throttle for the login endpoint (edge safety net; the
# app-layer OCA auth_brute_force lockout is a later ticket, P1-T19).
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

# XLSX export throttle (#326). Since #250 the export STREAMS -- the workbook is
# rebuilt on every GET rather than served once from a stored attachment -- so a
# replayed URL is a repeated aggregate scan over account.move.line plus a full
# xlsxwriter build. Repeated builds were already possible before #250 (the old
# action rebuilt on every click AND wrote an attachment), so this is bounding a
# pre-existing cost that got cheaper to trigger, not a new hole. Sized for real
# use: an accountant exporting several reports back to back must never be
# throttled, so the burst is generous and only a replay LOOP is capped.
limit_req_zone $binary_remote_addr zone=export:10m rate=30r/m;

# OAuth2 token endpoint throttle (#436). /api/v1/* matched NO location here and
# therefore no zone at all -- it fell through to `location /`, so the public
# API's failed-auth path had zero edge limiting. Every invalid attempt costs a
# PBKDF2-SHA512 in Odoo (the dummy hash on the unknown-client path is what keeps
# "unknown client" and "wrong secret" indistinguishable by timing), so an
# unbounded loop is CPU exhaustion. This zone rejects before Odoo is reached, so
# the hash never runs. Sized for machines, not humans: a token lives 3600s
# (TOKEN_TTL_SECONDS), so a well-behaved integration fetches roughly one per
# hour -- 30r/m absorbs dozens of integrations behind one NAT plus retries while
# capping a grinding loop hard. The app layer (ncollection.api.throttle) is the
# independent second layer ARCHITECTURE_SECURITY 6 asks for.
limit_req_zone $binary_remote_addr zone=apitoken:10m rate=30r/m;

# --- Bare `localhost` -> the platform host (#453, DEV ONLY) ----------------
# On the SaaS-routing stack (docker-compose.routing.yml: db_filter=^%d$,
# list_db=False) the hostname IS the database selector, so a request to bare
# `localhost` matches no database and Odoo 303s to /web/database/selector,
# which renders "The database manager has been disabled by the administrator".
# Secure (verified: no database names are disclosed) but a dead end for the URL
# every developer has typed for months.
#
# So bare `localhost` is sent to the PLATFORM host instead. This block is an
# EXACT server_name, which nginx prefers over the `*.localhost` wildcard below,
# so tenant hosts are unaffected.
#
# ⚠️ ONE LINE TO CHANGE if your platform database is not `ncollection`
# (the demo-tenant flow uses `ncplatform`, the verification suites `saastest`):
# edit the redirect target below. Dev-only file — nginx/conf.d/ncollection.prod.conf
# is untouched, and on the permissive `make up` stack this is simply a
# convenience hop to the same Odoo.
server {
    listen 80;
    server_name localhost;
    return 302 http://ncollection.localhost$request_uri;
}

server {
    listen 80;
    # `*.localhost` (not `.localhost`): the bare-localhost block above owns the
    # apex, this one owns every tenant/platform subdomain. `.localhost` covers
    # BOTH, which would collide with that exact-name server.
    server_name *.localhost;         # any *.localhost tenant or platform host

    # Odoo attachment/import uploads need more than nginx's 1M default.
    client_max_body_size 100M;

    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/gzip.conf;

    # Public URL policy (P1-T15): keep "odoo" out of public-facing URLs
    # (location = / rewrite + vanity 301 aliases). Backend /odoo stays as-is.
    include /etc/nginx/snippets/public-urls.conf;

    # Hard-block the DB manager at the edge (defense in depth — prod also sets
    # list_db=False in config/odoo.prod.conf). Covers /web/database/manager,
    # /web/database/selector, /web/database/create, ...
    location /web/database {
        return 403;
    }

    # #326: see the `export` zone above. burst=10 nodelay lets a user export the
    # whole report family in one go; the sustained 30r/m is what stops a loop.
    # 429 (not the nginx 503 default) so a throttled export is legible rather
    # than looking like a hung download.
    location ~ ^/ncollection/account_reports/xlsx/ {
        limit_req zone=export burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://odoo;
    }

    # Throttle the login endpoint only (form GET + auth POST share this URL).
    location = /web/login {
        limit_req zone=login burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://odoo;
    }

    # #436: the OAuth2 token endpoint, and ONLY it. An exact match, not a
    # /api/v1/ prefix -- the business endpoints P8-T02 (#78) adds will carry
    # real traffic and must be sized on their own evidence, not throttled today
    # by a number chosen for a credential endpoint.
    location = /api/v1/oauth/token {
        limit_req zone=apitoken burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://odoo;
    }

    # Realtime bus: Odoo 19 websocket + legacy longpolling -> bus upstream.
    location /websocket {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://odoo_bus;
    }
    location /longpolling {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://odoo_bus;
    }

    # Everything else -> Odoo HTTP.
    location / {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://odoo;
    }
}
