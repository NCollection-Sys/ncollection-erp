# ==========================================================================
#  NCollection ERP — DEV reverse proxy (ticket P1-T03)
# ==========================================================================
#  *.localhost over plain HTTP (NO TLS in dev). Mounted as the active
#  /etc/nginx/conf.d/default.conf by docker-compose.dev.yml.
#
#  ⚠️ WEBSOCKET PORT (the #1 easy-to-miss bug):
#  Dev Odoo runs workers=0 (threaded), so the realtime bus (Discuss websocket,
#  live notifications, presence) is served on the SAME port as HTTP — 8069.
#  Prod is the OPPOSITE (gevent bus on 8072; see ncollection.prod.conf), which
#  is why dev and prod are two separate files. Routing /websocket to the wrong
#  port kills live chatter SILENTLY (no error page). Verified on this repo's
#  dev container: 8069 is open and answers /websocket; 8072 is closed.
# ==========================================================================

# --- Upstreams (http context) ---------------------------------------------
upstream odoo     { server odoo:8069; }
upstream odoo_bus { server odoo:8069; }   # DEV: bus is on 8069, NOT 8072

# Websocket Connection header: "upgrade" while upgrading, else "" (close).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Coarse brute-force throttle for the login endpoint (edge safety net; the
# app-layer OCA auth_brute_force lockout is a later ticket, P1-T19).
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

server {
    listen 80;
    server_name .localhost;          # matches localhost + any *.localhost tenant

    # Odoo attachment/import uploads need more than nginx's 1M default.
    client_max_body_size 100M;

    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/gzip.conf;

    # Hard-block the DB manager at the edge (defense in depth — prod also sets
    # list_db=False in config/odoo.prod.conf). Covers /web/database/manager,
    # /web/database/selector, /web/database/create, ...
    location /web/database {
        return 403;
    }

    # Throttle the login endpoint only (form GET + auth POST share this URL).
    location = /web/login {
        limit_req zone=login burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://odoo;
    }

    # Realtime bus: Odoo 19 websocket + legacy longpolling -> bus upstream.
    location /websocket {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://odoo_bus;
    }
    location /longpolling {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://odoo_bus;
    }

    # Everything else -> Odoo HTTP.
    location / {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://odoo;
    }
}
