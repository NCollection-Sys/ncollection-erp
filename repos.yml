# ============================================================================
#  OCA dependency pin list (ticket P1-T04) — the single source of truth for
#  every external addon repo this platform consumes.
# ============================================================================
#  Regenerate ./oca/ from these pins (identical on any machine, CI included):
#      make oca            # installs git-aggregator into .oca-venv and runs it
#
#  Update workflow (documented in docs/markdown/OCA_DEPENDENCIES.md):
#      1. bump the commit hash on ONE repo below
#      2. make oca && make restart  -> smoke-test locally
#      3. PR -> CI green -> 1 review -> merge
#
#  Rules:
#  - Pin EXACT commit hashes, never bare branch names (branches move; pins don't).
#  - One block per repo so a whole repo can be dropped by deleting its block.
#  - SUNSET notes mark tactical bootstraps that native ncollection_* modules
#    will replace — keep those blocks easy to delete.
#
#  Pins resolved 2026-07-19 from each repo's 19.0 branch HEAD. The previously
#  vendored copies were an unpinned snapshot of the same branches one day
#  earlier (account_financial_report 19.0.0.0.13 -> .15 + new i18n; no other
#  consumed-module code delta — diff-verified before de-vendoring).
# ============================================================================

# --- Financial reporting (SUNSET: #117 [F2-T07] — retired when native
# --- ncollection_account_reports reaches parity. Consumed: account_financial_report)
./oca/account-financial-reporting:
  remotes:
    oca: https://github.com/OCA/account-financial-reporting.git
  merges:
    - oca aa34bf33fc96fbae7fb5a2b9609b807b4e20514c
  target: oca aggregated

