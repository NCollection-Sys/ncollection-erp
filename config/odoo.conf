; ============================================================================
;  NCollection ERP — LOCAL DEVELOPMENT Odoo config
; ============================================================================
;  This is a lightweight DEV bootstrap so a new developer can run the stack
;  locally with sensible defaults. It is intentionally NOT the production
;  configuration.
;
;  The production / multi-tenant config (db_filter, list_db=False, proxy_mode,
;  workers, real secrets) is owned by ticket **P1-T02** (Multi-Tenant Odoo
;  Configuration & Secrets) and **P1-T03** (Nginx). Do not treat the commented
;  TODOs below as done — see docs/markdown/LOCAL_DEV_AND_ARCHITECTURE.md.
;
;  DB connection (db_host / db_user / db_password) is injected by the Docker
;  image entrypoint from the HOST / USER / PASSWORD env vars in
;  docker-compose.yml, so it is deliberately not repeated here.
; ============================================================================

[options]

; Where Odoo looks for modules. Our custom addons are bind-mounted here from
; ./custom_addons on the host. Odoo also auto-includes its own core addons
; (base, web, mail, …), so they don't need to be listed.
addons_path = /mnt/extra-addons

; Filestore & sessions (matches the odoo_data volume in docker-compose.yml).
data_dir = /var/lib/odoo

; Master password for the database-manager UI (create / drop / backup DBs at
; http://localhost:8069/web/database/manager). DEV-ONLY value — production uses
; a real secret via P1-T02.
admin_passwd = ncollection_dev

; Dev convenience: allow the database manager and the DB list so a newcomer can
; create their first database from the browser.
list_db = True

; Threaded mode (workers = 0) is best for local dev: it enables the Python
; debugger and --dev auto-reload. Production sets a real worker count (P1-T02).
workers = 0

log_level = info

; ---------------------------------------------------------------------------
; PRODUCTION TODOs — implemented by P1-T02 / P1-T03, NOT here:
;
;   db_filter = ^%d$        ; route each subdomain to its own tenant database
;   list_db = False         ; hide the database manager/selector from tenants
;   proxy_mode = True       ; trust X-Forwarded-* headers from Nginx
;   workers = 4             ; sized to the production host
;   admin_passwd = <secret from a real secrets store, not committed>
; ---------------------------------------------------------------------------
