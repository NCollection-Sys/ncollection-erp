; ============================================================================
;  NCollection ERP — PRODUCTION / multi-tenant Odoo config  (ticket P1-T02)
; ============================================================================
;  This is the multi-tenant, hardened config. It is NOT used by a plain
;  `docker compose up` (that uses the dev config config/odoo.conf). It is
;  selected by docker-compose.prod.yml, which runs Odoo with:
;      odoo -c /etc/odoo/odoo.prod.conf
;
;  db_host / db_port / db_user / db_password are injected by the Docker image
;  entrypoint from the HOST / USER / PASSWORD env vars (from .env), so real DB
;  secrets never live in this committed file.
;
;  Routing is only fully exercised once Nginx (P1-T03) and the DB-routing
;  verification (P1-T06) land. This ticket delivers the config; those wire it.
;
;  IMPORTANT: Odoo config does NOT support inline `;` comments after a value —
;  every comment must be on its own line (learned the hard way in P1-T02).
; ============================================================================

[options]

; --- Multi-tenant routing (the core of this ticket) ---
; Route by SUBDOMAIN: `%d` = first hostname component
; (clienta.ncollectionerp.com -> database "clienta"). `%h` = FULL hostname = WRONG.
db_filter = ^%d$
; SECURITY: hide the database selector/manager entirely.
list_db = False
; Trust X-Forwarded-* headers coming from Nginx (P1-T03).
proxy_mode = True

; --- Paths (Odoo auto-includes its own core addons) ---
; P1-T04 adds /mnt/oca-addons here via git-aggregator.
; OCA repos are mounted at /mnt/oca-addons (generated by `make oca` from
; repos.yml — P1-T04). OCA layout requires one addons_path entry per repo.
addons_path = /mnt/extra-addons,/mnt/oca-addons/account-financial-reporting,/mnt/oca-addons/mis-builder,/mnt/oca-addons/reporting-engine,/mnt/oca-addons/server-auth,/mnt/oca-addons/server-tools,/mnt/oca-addons/server-ux
data_dir = /var/lib/odoo

; --- Performance (4 vCPU / 8 GB baseline; re-tuned under load in P3-T03) ---
workers = 4
max_cron_threads = 1
; 2.5 GB hard / 2.0 GB soft per worker.
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_time_cpu = 600
limit_time_real = 1200
limit_time_real_cron = 3600

; --- Secrets ---
; DB-manager master password. list_db=False already disables the manager UI,
; but this MUST still be replaced with a real secret in production (never ship
; this placeholder). Full secret-store integration is P2-T08 hardening.
admin_passwd = ncollection_dev

log_level = info
