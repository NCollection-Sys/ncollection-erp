# ============================================================================
#  NCollection ERP — tuned postgresql.conf  (ticket P3-T02)
#  ARCHITECTURE_DATA_PLATFORM.md §9 · multi-tenant Odoo 19 (database-per-tenant)
# ============================================================================
#  Applied by the db service via:
#      postgres -c config_file=/etc/postgresql/postgresql.conf   (docker-compose.yml)
#  A command-line `-c` STILL WINS over this file, so the prod overlay
#  (docker-compose.prod.yml) overrides ONLY the two host-RAM-dependent knobs for
#  the prod box — everything else below is the single committed template.
#
#  pg_hba.conf / ident are NOT named here, so they keep defaulting to the data
#  directory (auth rules generated by the image at initdb stay in effect).
#
#  ACTIVE VALUES BELOW ARE DEV/CI-SAFE — they boot on any laptop or CI runner.
#  --------------------------------------------------------------------------
#  PRODUCTION SIZING (scale to host RAM, §9 — shared_buffers = 25% RAM,
#  effective_cache_size = 75% RAM):
#    · 50-tenant target (Hetzner CX52, 16 vCPU / 32 GB) — set by the prod overlay:
#        shared_buffers = 8GB · effective_cache_size = 24GB · max_wal_size = 4GB
#    · 10-tenant box   (CX42, 8 vCPU / 16 GB):
#        shared_buffers = 4GB · effective_cache_size = 12GB
# ============================================================================

# --- Connections -----------------------------------------------------------
# REQUIRED: config_file replaces the data-dir config, whose default is
# 'localhost'; the odoo container reaches Postgres over the compose network.
listen_addresses = '*'
max_connections = 200               # PgBouncer (P2-T09) absorbs client fan-in (§4.2)

# --- Memory  (prod overlay overrides shared_buffers + effective_cache_size) --
shared_buffers = 256MB              # PROD: 25% RAM (8GB @ 32GB)
effective_cache_size = 1GB          # PROD: 75% RAM (24GB @ 32GB) — planner hint, no alloc
work_mem = 64MB                     # §9 — per sort/hash operation
maintenance_work_mem = 512MB        # §9 — VACUUM / CREATE INDEX / REINDEX

# --- Storage & planner  (NVMe SSD, §9) -------------------------------------
random_page_cost = 1.1              # §9 — NVMe: random ≈ sequential
effective_io_concurrency = 200      # NVMe services many concurrent I/Os
maintenance_io_concurrency = 200
jit = off                           # Odoo is OLTP; JIT compile cost hurts short queries

# --- WAL & checkpoints  (§9) ------------------------------------------------
wal_compression = on                # §9 — smaller WAL, cheaper PITR (P2-T04)
archive_timeout = 60                # §9 — bound WAL segment latency for PITR
checkpoint_completion_target = 0.9  # spread checkpoint I/O to avoid stalls
max_wal_size = 2GB                  # prod overlay raises to 4GB
min_wal_size = 512MB
wal_buffers = 16MB

# --- Query telemetry — pg_stat_statements  (§9 rule 6: "always on from Phase 3")
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all
pg_stat_statements.track_utility = off   # skip DDL/utility noise
pg_stat_statements.save = on
track_io_timing = on                # richer stats + EXPLAIN (ANALYZE, BUFFERS)

# --- Logging  (slow-query capture — acceptance criterion) ------------------
log_min_duration_statement = 500    # log every statement >= 500ms
# Do NOT write literal bind-parameter VALUES into the slow-query log: on a
# multi-tenant SaaS those are tenant PII (amounts, names, phone numbers). 0
# suppresses the `DETAIL: parameters: $1 = '...'` values while keeping the
# normalized statement + timing — which is what you actually tune on.
log_parameter_max_length = 0
log_line_prefix = '%m [%p] %q%u@%d '
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0                  # log ALL temp-file spills (signals work_mem too low)
# Log only autovacuums that actually took a while: at the 50-tenant target one
# cluster hosts many DBs, and `0` (log every run) floods the log with fast
# no-op vacuums. 250ms keeps the ones worth investigating.
log_autovacuum_min_duration = 250
log_timezone = 'UTC'

# --- Autovacuum  (many small tenant DBs on one cluster) --------------------
autovacuum = on
autovacuum_max_workers = 5
autovacuum_naptime = 30s

# --- Locale / defaults  (built-in defaults would drift from the image) -----
timezone = 'UTC'
datestyle = 'iso, mdy'
default_text_search_config = 'pg_catalog.english'
lc_messages = 'C'
