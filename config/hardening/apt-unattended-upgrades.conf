// NCollection ERP — unattended SECURITY upgrades  (ticket P2-T08)
// Installed by scripts/deploy/harden.sh to
//     /etc/apt/apt.conf.d/52ncollection-unattended
// Loaded after the stock 50unattended-upgrades, so these override it.
//
// Security origins only — feature upgrades stay manual (predictable prod).
Unattended-Upgrade::Allowed-Origins {
    "${distro_id}:${distro_codename}-security";
    "${distro_id}ESMApps:${distro_codename}-apps-security";
    "${distro_id}ESM:${distro_codename}-infra-security";
};

// Never auto-reboot a production host unattended — schedule kernel reboots by
// hand (a live-restore Docker daemon survives the daemon restart regardless).
Unattended-Upgrade::Automatic-Reboot "false";

Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
Unattended-Upgrade::Remove-Unused-Dependencies "true";
