# ============================================================================
#  NCollection ERP — SSH hardening drop-in  (ticket P2-T08)
# ============================================================================
#  Installed by scripts/deploy/harden.sh to:
#      /etc/ssh/sshd_config.d/60-ncollection.conf
#  Drop-ins override the shipped sshd_config. harden.sh runs `sshd -t` before
#  reloading, so a syntax error never bricks remote access.
#
#  ⚠️ Key-only auth: a working public key MUST be in the deploy user's
#  authorized_keys BEFORE this lands — harden.sh refuses to proceed otherwise.
# ============================================================================

# No passwords, no root, keys only.
PasswordAuthentication no
PermitRootLogin no
PubkeyAuthentication yes
KbdInteractiveAuthentication no

# Trim the attack surface.
X11Forwarding no
AllowTcpForwarding no
MaxAuthTries 3
LoginGraceTime 30

# Drop dead sessions.
ClientAliveInterval 300
ClientAliveCountMax 2
