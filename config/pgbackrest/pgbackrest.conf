# ==========================================================================
#  NCollection ERP — pgBackRest  (ticket P2-T04, ARCHITECTURE_DATA_PLATFORM §5)
# ==========================================================================
#  Dev/test defaults: a LOCAL posix repo, encrypted. Production overrides the
#  repo to Backblaze B2 (S3-compatible) purely via environment variables — no
#  secret ever lives in this committed file:
#     PGBACKREST_REPO1_TYPE=s3
#     PGBACKREST_REPO1_S3_BUCKET / _ENDPOINT / _REGION / _KEY / _KEY_SECRET
#     PGBACKREST_REPO1_CIPHER_PASS   (REQUIRED — the aes-256-cbc passphrase)
#  See docs/markdown/RUNBOOK_BACKUP_PITR.md.
# ==========================================================================
[global]
repo1-path=/var/lib/pgbackrest
repo1-retention-full=2
repo1-retention-full-type=count
# Encryption at rest (§5). The passphrase comes from the environment
# (PGBACKREST_REPO1_CIPHER_PASS), never from this file.
repo1-cipher-type=aes-256-cbc
compress-type=zst
# Continuous archiving without blocking the WAL writer.
archive-async=y
spool-path=/var/spool/pgbackrest
start-fast=y
log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest

[ncollection]
pg1-path=/var/lib/postgresql/data
# Connect for pg_backup_start/stop over the local socket (trust for local in the
# stock image). POSTGRES_USER here is a superuser named `odoo`; there is no
# `postgres` role, so name it explicitly.
pg1-user=odoo
pg1-database=postgres
