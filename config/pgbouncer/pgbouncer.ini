;; ==========================================================================
;;  NCollection ERP — PgBouncer  (ticket P2-T09)
;;  Topology: ARCHITECTURE_DATA_PLATFORM.md §4.2
;; ==========================================================================
;;  Transaction pooling for Odoo HTTP workers ONLY. The realtime bus (8072),
;;  the cron worker and the queue_job runner connect DIRECT to PostgreSQL —
;;  LISTEN/NOTIFY, advisory locks and long-lived sessions all break under
;;  transaction pooling (a silent-bus class of bug). See docker-compose.pooling.yml.
;; ==========================================================================

[databases]
;; Wildcard: with database-per-tenant, ANY tenant DB is proxied to Postgres
;; under the same name — no per-tenant config needed on provisioning. Add a
;; per-hot-tenant override to stop one tenant starving the fleet, e.g.:
;;     clienta = host=db port=5432 pool_size=12
* = host=db port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

;; Odoo/psycopg2 sends `extra_float_digits` in the startup packet — PgBouncer
;; rejects unknown startup params unless told to ignore them. THE #1
;; Odoo+PgBouncer gotcha; without this every connection fails.
ignore_startup_parameters = extra_float_digits

;; High-efficiency mode: a server connection is held only for a transaction.
pool_mode = transaction
max_client_conn = 2000
default_pool_size = 8
reserve_pool_size = 4
reserve_pool_timeout = 3
server_idle_timeout = 300

;; SHOW POOLS / SHOW STATS access for pool-saturation monitoring (P2-T10 hook).
admin_users = odoo
stats_users = odoo
