services:

  db:
    image: postgres:16
    container_name: ncollection-db
    environment:
      POSTGRES_DB: ${DB_NAME:-postgres}
      POSTGRES_USER: ${DB_USER:-odoo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-odoo}
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data

  odoo:
    image: odoo:19
    container_name: ncollection-odoo
    depends_on:
      - db
    ports:
      - "8069:8069"
    environment:
      HOST: db
      USER: ${DB_USER:-odoo}
      PASSWORD: ${DB_PASSWORD:-odoo}
    restart: always
    volumes:
      - odoo_data:/var/lib/odoo
      - ./custom_addons:/mnt/extra-addons
      # Local-dev Odoo config. Values above (${VAR:-default}) come from an
      # optional .env; the stack still runs with no .env present. Production
      # config is P1-T02 — see docs/markdown/LOCAL_DEV_AND_ARCHITECTURE.md.
      - ./config/odoo.conf:/etc/odoo/odoo.conf:ro

volumes:
  postgres_data:
  odoo_data:
