services:

  db:
    image: postgres:16
    container_name: ncollection-db
    environment:
      POSTGRES_DB: ${DB_NAME:-postgres}
      POSTGRES_USER: ${DB_USER:-odoo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-odoo}
    restart: always
    # Tuned multi-tenant config (P3-T02, ARCHITECTURE_DATA_PLATFORM §9). `-c` on
    # the command line still wins over the file, so the prod overlay
    # (docker-compose.prod.yml) overrides only the host-RAM-dependent knobs.
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    ports:
      # Host 5433 -> container 5432, so a local Postgres install (which
      # normally owns host 5432) never conflicts. Connect pgAdmin4 /
      # any DB client to localhost:5433.
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    healthcheck:
      # `-d` is REQUIRED: pg_isready with no -d targets a database named after the
      # USER ("odoo"), which does not exist here — so every probe logged
      # `FATAL: database "odoo" does not exist` every 10s forever. The check still
      # passed (it only needs the server to answer), so it was pure log noise
      # hiding real errors. See REGRESSIONS.md R-003 / invariants.py rule R1.
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-odoo} -d ${DB_NAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  odoo:
    image: odoo:19
    container_name: ncollection-odoo
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
    environment:
      HOST: db
      USER: ${DB_USER:-odoo}
      PASSWORD: ${DB_PASSWORD:-odoo}
      # Config-sync service-account bearer key (P2-T03). Read from .env; the
      # platform uses it to push plan changes into tenant DBs. Empty by default
      # (config sync then fails soft + logs).
      NC_CONFIG_SYNC_KEY: ${NC_CONFIG_SYNC_KEY:-}
      # Stripe test-mode keys (P2-T13). Read from .env; ncollection_billing
      # configures the admin-DB Stripe provider from these. Empty by default,
      # so online payment simply stays disabled (never a half-configured
      # provider). NEVER commit real keys — .env is gitignored.
      NC_STRIPE_SECRET_KEY: ${NC_STRIPE_SECRET_KEY:-}
      NC_STRIPE_PUBLISHABLE_KEY: ${NC_STRIPE_PUBLISHABLE_KEY:-}
      NC_STRIPE_WEBHOOK_SECRET: ${NC_STRIPE_WEBHOOK_SECRET:-}
    restart: always
    volumes:
      - odoo_data:/var/lib/odoo
      - ./custom_addons:/mnt/extra-addons
      # OCA addon repos (P1-T04): ./oca is GENERATED from repos.yml pins —
      # run `make oca` after a fresh clone (CI aggregates the same pins).
      - ./oca:/mnt/oca-addons:ro
      # Base mounts the DEV config (config/odoo.conf: list_db=True, workers=0)
      # so a plain `docker compose up` gives a working localhost dev stack.
      # The production multi-tenant config is config/odoo.prod.conf, selected
      # by docker-compose.prod.yml. See docs/markdown/LOCAL_DEV_AND_ARCHITECTURE.md.
      - ./config/odoo.conf:/etc/odoo/odoo.conf:ro
    # --max-cron-threads=0 HERE, not only in the overlays (#343). The image's
    # CMD is a bare `odoo`, and its built-in defaults are max_cron_threads=2
    # with db_name unset — so a plain `docker compose up`, which the comment
    # above explicitly invites, produced a container that ran the crons of
    # EVERY database on the developer's persistent postgres_data volume.
    # `--db-filter` would not have helped: `cron_database_list()` is
    # `config['db_name'] or list_dbs(True)` and does not consult it (#337).
    #
    # Every overlay that needs different behaviour REPLACES this line rather
    # than merging with it — dev/routing restate the flag, prod/pooling/staging
    # bring their own command — so this is a floor for the bare invocation, not
    # a constraint on any deployment.
    command: odoo --max-cron-threads=0
    healthcheck:
      # /web/health is Odoo's built-in no-database health route (200 OK).
      test: ["CMD-SHELL", "curl -sf http://localhost:8069/web/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  postgres_data:
  odoo_data:
