# ============================================================================
#  Provisioning runner overlay  (ticket P2-T01 — OPT-IN)
# ============================================================================
#  The isolated satellite that runs OCA queue_job's jobrunner in its OWN,
#  resource-limited container, so heavy tenant provisioning (CREATE DATABASE +
#  module installs) NEVER shares a process with the HTTP workers serving live
#  tenants (ARCHITECTURE_DATA_PLATFORM §10, ARCHITECTURE_SECURITY §11).
#
#  Layer it on top of base (+ dev or prod):
#    docker compose -f docker-compose.yml -f docker-compose.dev.yml \
#                   -f docker-compose.saas.yml up -d provisioning-runner
#
#  It is OPT-IN: `make up` and CI never start it. The engine itself is a plain
#  method (`action_run_sync` / the "Provision (inline)" button), so it can be
#  exercised WITHOUT this container — the container only adds the async,
#  off-the-HTTP-workers execution that matters in production.
#
#  PLATFORM_DB defaults to `ncollection`; set it in .env for another admin DB.
# ============================================================================
services:

  provisioning-runner:
    image: odoo:19
    container_name: ncollection-provisioning-runner
    depends_on:
      db:
        condition: service_healthy
    environment:
      # DB connection (same as the odoo service; entrypoint injects db args).
      HOST: db
      USER: ${DB_USER:-odoo}
      PASSWORD: ${DB_PASSWORD:-odoo}
      # queue_job channel capacity.
      #
      # A child's job must clear its PARENT's capacity too — jobrunner/channels.py
      # `get_jobs_to_run` pulls children's jobs into the parent queue and then
      # yields only `while self.has_capacity()`. So root is a cap on the whole
      # subtree, not a default for jobs sitting directly on root.
      #
      # That is why root moved 1 -> 2 (#310). At root:1 the platform ran ONE
      # queued job at a time and 'root.provisioning:2' could never actually
      # reach 2. It also means outbound work needs a root slot to spare: with
      # root:2 a stalled fetch on root.outbound can hold at most half, so
      # provisioning / backup / fleet-migration / config-sync always retain one.
      #
      # root.outbound is capacity 1 on purpose — this is where a slow external
      # host is allowed to be slow, in isolation. One concurrent outbound job is
      # all the platform needs.
      ODOO_QUEUE_JOB_CHANNELS: root:2,root.provisioning:2,root.outbound:1
      # Config-sync bearer key (P2-T03): the reconcile cron + queued live syncs
      # run here, so the runner needs the same key as the odoo service.
      NC_CONFIG_SYNC_KEY: ${NC_CONFIG_SYNC_KEY:-}
      # The tenant backup engine (ncollection_saas/scripts/backup/tenant_backup.sh) runs IN this process: scheduled
      # backups and every Fleet Migration pre-upgrade snapshot. REQUIRED (.env.example); never in git.
      TENANT_BACKUP_CIPHER_PASS: ${TENANT_BACKUP_CIPHER_PASS:-}
      # The platform base domain tenant hosts hang off (<tenant>.<NC_BASE_DOMAIN>). ONE authority: SaaS Settings
      # overrides it, this is what the deployment IS, and there is no built-in default. Dev: ncollection.localhost.
      # Production sets its real domain in .env. docs/markdown/TENANT_URLS.md
      NC_BASE_DOMAIN: ${NC_BASE_DOMAIN:-ncollection.localhost}
      # DEV ONLY (#475) — temporary tenant-admin password for local testing.
      # EMPTY BY DEFAULT AND MUST STAY EMPTY OUTSIDE LOCAL DEVELOPMENT. When it
      # holds a value, tenant provisioning gives the new admin THAT password and
      # skips the forced reset, so a developer can log in immediately. Unset (a
      # production .env simply does not define it) leaves the hardened default:
      # an unguessable random password that is never disclosed, plus a forced
      # reset. Same shape as the keys above — the value lives only in .env.
      NC_DEV_SEED_PASSWORD: ${NC_DEV_SEED_PASSWORD:-}
      # WHERE TO PUSH TENANT CONFIG (#465). Not localhost: this container's own
      # HTTP server is scoped `-d ${PLATFORM_DB} --db-filter=^${PLATFORM_DB}$$`
      # (see the command below), so a push carrying a TENANT's Host header
      # matches no database there and Odoo answers "No database is selected"
      # -> HTTP 404. Every config sync from this runner failed that way until
      # #463 made the runner run and the failure became visible.
      #
      # `odoo` is the multi-tenant service on this compose network and is
      # reachable from every container, including itself, so this value is
      # correct for the whole stack rather than just for the runner.
      NC_INTERNAL_BASE_URL: ${NC_INTERNAL_BASE_URL:-http://odoo:8069}
    # --load starts the queue_job jobrunner thread. It shells out (odoo
    # subprocess) to build tenant DBs — never a cross-DB ORM call.
    #
    # `-d` IS LOAD-BEARING AND IS NOT REDUNDANT WITH `--db-filter` (#343).
    # db_filter pins HTTP routing only. Cron is chosen separately:
    # `cron_database_list()` is `config['db_name'] or list_dbs(True)`, so
    # without a `-d` this runner ticked the crons of EVERY database on the
    # server — including every tenant DB it is explicitly not supposed to
    # watch, and, following this file's own documented dev invocation, all ~89
    # local fixtures. Same finding as #337; different fix, because this
    # container is SUPPOSED to run cron (the config-sync reconcile job lives
    # here), so `--max-cron-threads=0` would silently stop that job instead.
    # Neither odoo.conf nor odoo.prod.conf sets `db_name`, so `-d` on the
    # command line is the only thing that scopes it.
    #
    # `--limit-time-real` IS LOAD-BEARING TOO. A queue job is served as an HTTP
    # request by one of these workers, and Odoo kills a worker whose request runs
    # past `limit_time_real` — 120 seconds when nothing sets it, which is what
    # this runner had. Provisioning builds a database and installs the plan's
    # modules (2+ minutes for a plain plan), so EVERY real provisioning died
    # mid-run: "WorkerHTTP timeout after 120s", the job re-queued as "dead", the
    # re-run colliding with the half-built database it had itself left behind.
    # The limit must exceed the engine's own subprocess cap
    # (saas_subprocess.SUBPROCESS_TIMEOUT, 30 min), or the worker is shot before
    # the engine can time out cleanly and report a legible failure.
    #
    # `ncollection_core` IN `--load` IS LOAD-BEARING (release gate). `--load`
    # REPLACES server_wide_modules from odoo.conf, and ncollection_core is the
    # server-wide module that installs the release gate (release_gate.py): HTTP,
    # cron and the `-d` preload. Without it this runner - the process that runs
    # the platform's crons - loaded and ran a platform database the code is
    # ahead of. Enforced by scripts/ci/invariants.py.
    command: >
      odoo -c /etc/odoo/odoo.conf
           --load=base,web,queue_job,ncollection_core
           --workers=2 --max-cron-threads=1
           --limit-time-real=3600
           -d ${PLATFORM_DB:-ncollection}
           --db-filter=^${PLATFORM_DB:-ncollection}$$
    volumes:
      - ./custom_addons:/mnt/extra-addons:ro
      - ./oca:/mnt/oca-addons:ro
      # NC_RUNNER_CONF lets a PRODUCTION deploy run this container on
      # config/odoo.prod.conf (no dev master password) without forking this
      # overlay. Unset = the dev config, which is what local stacks want.
      - ${NC_RUNNER_CONF:-./config/odoo.conf}:/etc/odoo/odoo.conf:ro
      - odoo_data:/var/lib/odoo
    # Egress backstop (#311): db-plane (direct to db) + egress `default`. This is
    # the container where the `root.outbound` queue_job channel runs, so the ECB
    # rate fetch actually egresses HERE — its host must be in the allowlist.
    networks:
      - default
      - nc_dbplane
    # Resource caps: heavy but bounded, so a provisioning spike can never starve
    # the interactive stack (SECURITY §11 — resource exhaustion).
    mem_limit: 1500m
    cpus: 1.0
    restart: unless-stopped
