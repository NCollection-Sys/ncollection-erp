[flake8]
; Odoo community conventions:
; - __init__.py files import submodules purely for registration (models,
;   controllers) — F401 "imported but unused" is the idiom, not a bug.
; - 119-char lines (Odoo/OCA de-facto standard; the stock 79 rejects the
;   existing codebase).
max-line-length = 119
per-file-ignores =
    __init__.py:F401
